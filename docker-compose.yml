# essersales Phase 3-4B — Docker Compose (PG API + PostgreSQL + nginx)

services:
  db:
    image: postgres:16-alpine
    container_name: essersales-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-essersales}
      POSTGRES_USER: ${DB_USER:-essersales}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-essersales_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-essersales} -d ${DB_NAME:-essersales}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: essersales-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-essersales}
      DB_USER: ${DB_USER:-essersales}
      DB_PASSWORD: ${DB_PASSWORD:-essersales_dev}
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
      MIGRATIONS_DIR: /app/infra/db
    volumes:
      - uploads:/data/uploads
      - exports:/data/exports
      - ./infra/db:/app/infra/db:ro
    ports:
      - "${API_PORT:-3002}:3001"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    container_name: essersales-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
    name: essersales-pgdata
  uploads:
    name: essersales-uploads
  exports:
    name: essersales-exports
