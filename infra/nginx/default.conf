# essersales Phase 0 — reverse proxy (API only; Vue는 기존 dev/preview 서버 사용)

upstream essersales_api {
    server api:3001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Phase 0 health / API
    location /api/ {
        proxy_pass http://essersales_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 루트 — Phase 0 안내 (기존 Vue 미포함)
    location / {
        default_type application/json;
        return 200 '{"service":"essersales","phase":0,"message":"API proxy is running. Use existing Vue dev server (npm run dev) for the UI.","health":"/api/v1/health"}';
    }
}
